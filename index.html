<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trupe Training</title>
 <link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#070b18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trupe Training">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe6ff;--bg2:#d8c2ff;--card:#fff;--txt:#1e1233;--mut:#6b5b8a;--acc:#7c3aed;--ok:#9333ea;--bd:#d9c9f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120a22;--bg2:#2a1450;--card:#1d1233;--txt:#f3ecff;--mut:#b4a3d6;--acc:#a855f7;--ok:#c084fc;--bd:#3a2760}}
:root[data-theme="dark"]{--bg:#120a22;--bg2:#2a1450;--card:#1d1233;--txt:#f3ecff;--mut:#b4a3d6;--acc:#a855f7;--ok:#c084fc;--bd:#3a2760}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 12px;color:var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{flex:1;min-width:48px;padding:8px 0;border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:10px;font-weight:600;cursor:pointer}
.tab.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.tab.hoje:not(.sel){border-color:var(--acc)}
.quote{margin:14px 0;padding:16px 18px;background:var(--card);border-left:8px solid var(--acc);border-radius:10px;font-family:"Anton",Impact,"Arial Black",sans-serif;font-weight:400;font-style:italic;text-transform:uppercase;letter-spacing:1.5px;font-size:1.45rem;line-height:1.15;text-shadow:2px 2px 0 rgba(168,85,247,.55);box-shadow:0 0 18px rgba(168,85,247,.3)}
.card{box-shadow:0 0 24px rgba(168,85,247,.3);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top h2{margin:0;font-size:1.1rem}
.mut{color:var(--mut);font-size:.9rem}
.bar{height:8px;background:var(--bd);border-radius:99px;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
ul{list-style:none;margin:10px 0 0;padding:0}
li label{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--bd);cursor:pointer}
li:first-child label{border-top:0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
li.done .txt{color:var(--mut)}
li.done .ch{text-decoration:line-through}
.msg{margin-top:12px;text-align:center;font-weight:700;color:var(--ok);min-height:1.4em}
button.reset{margin-top:10px;background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:.85rem}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99}
@keyframes tremer{0%,100%{transform:translate(0,0)}10%{transform:translate(-9px,5px) rotate(-.6deg)}20%{transform:translate(8px,-6px) rotate(.6deg)}30%{transform:translate(-7px,-4px)}40%{transform:translate(7px,6px) rotate(.4deg)}50%{transform:translate(-6px,3px)}60%{transform:translate(5px,-5px)}70%{transform:translate(-4px,4px)}80%{transform:translate(3px,-2px)}90%{transform:translate(-2px,2px)}}
main.tremer{animation:tremer .55s ease-in-out}
@media (prefers-reduced-motion:reduce){main.tremer{animation:none}}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(90deg,#7c3aed,#4c1d95);color:#fff;padding:10px 14px;box-shadow:0 4px 18px rgba(124,58,237,.45)}
.hud-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.lv{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid #e9d5ff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none;box-shadow:0 0 14px rgba(233,213,255,.5)}
.lv small{font-size:.58rem;letter-spacing:1px}
.lv b{font-size:1.5rem}
.xpw{flex:1;min-width:0}
.xpl{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;margin-bottom:5px}
.xpl strong{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpb{height:12px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden}
.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e9d5ff,#c084fc);box-shadow:0 0 10px #e9d5ff;transition:width .5s}
.xpt{font-size:.72rem;opacity:.85;margin-top:3px}
.hud.pulse{animation:pulso .7s}
@keyframes pulso{50%{filter:brightness(1.6)}}
.pop{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);font-weight:800;font-size:1.5rem;color:#e9d5ff;text-shadow:0 0 12px #a855f7;z-index:120;pointer-events:none;animation:subir 1.2s ease-out forwards;white-space:nowrap}
@keyframes subir{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}
.lvlup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:110;pointer-events:none;text-align:center;color:#fff;text-shadow:0 0 20px #a855f7,0 0 40px #7c3aed;animation:lvl 2.2s ease-out forwards}
.lvlup b{font-size:2.8rem;letter-spacing:2px}
.lvlup span{font-size:1.2rem}
@keyframes lvl{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
.dica{text-align:center;margin-top:12px}

.wd{white-space:nowrap}
.ch{display:inline-block;cursor:default;transition:transform .15s,color .15s,text-shadow .15s}
.ch:hover{transform:translateY(-4px) scale(1.35);color:var(--acc);text-shadow:0 0 10px #a855f7}
.ch.zap{animation:zap .9s ease-out both}
@keyframes zap{
 0%{transform:none}
 25%{transform:translate(var(--dx,0px),-16px) scale(1.5) rotate(var(--rot,-8deg));color:#a855f7;text-shadow:0 0 8px #a855f7,0 0 18px #7c3aed}
 50%{transform:translate(calc(var(--dx,0px)*-1),2px) scale(1.2) rotate(calc(var(--rot,0deg)*-1));color:#c084fc;text-shadow:0 0 10px #a855f7}
 75%{transform:translate(2px,-3px) scale(1.1);text-shadow:0 0 6px #a855f7}
 100%{transform:none}}
@media (prefers-reduced-motion:reduce){.ch.zap{animation:none}}

#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:150}
.conq{margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin-top:12px}
.bd{border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center;background:var(--bg)}
.bd.on{border-color:var(--acc);box-shadow:0 0 12px rgba(168,85,247,.45)}
.bd.off{opacity:.5;filter:grayscale(1)}
.bi{font-size:1.8rem;line-height:1.2}
.bn{font-weight:700;font-size:.85rem;margin-top:4px}
.bs{font-size:.72rem;color:var(--mut);margin-top:2px}
.bdg{position:fixed;inset:0;z-index:130;display:flex;align-items:center;justify-content:center;background:rgba(10,4,24,.82);cursor:pointer;animation:fadein .3s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.bdg-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;text-align:center;color:#fff;max-width:94vw}
.ring{position:absolute;left:50%;top:38%;width:120px;height:120px;margin:-60px 0 0 -60px;border:5px solid #e9d5ff;border-radius:50%;box-shadow:0 0 24px #a855f7;animation:onda 1s ease-out both;pointer-events:none}
.ring.r2{animation-delay:.25s;border-color:#ffd43b}
@keyframes onda{0%{transform:scale(.2);opacity:1}100%{transform:scale(7);opacity:0}}
.bdg-ico{font-size:5rem;line-height:1;animation:girar .8s cubic-bezier(.2,1.5,.4,1) both,flutuar 1.6s .8s ease-in-out infinite alternate}
@keyframes girar{0%{transform:scale(0) rotate(-300deg)}100%{transform:scale(1) rotate(0)}}
@keyframes flutuar{to{transform:translateY(-8px) scale(1.06)}}
.boom{font-size:clamp(2rem,10vw,3.6rem);font-weight:900;text-transform:uppercase;line-height:1.05;color:#fff;text-shadow:0 0 10px #ffd43b,0 0 24px #a855f7,0 0 48px #7c3aed;animation:explode .9s cubic-bezier(.2,1.6,.4,1) .15s both,pulsar 1s 1.05s ease-in-out infinite alternate}
@keyframes explode{0%{transform:scale(0) rotate(-14deg);opacity:0;filter:blur(8px)}35%{transform:scale(1.7) rotate(5deg);opacity:1;filter:blur(0)}55%{transform:scale(.9) rotate(-3deg)}75%{transform:scale(1.12)}100%{transform:scale(1) rotate(0)}}
@keyframes pulsar{to{transform:scale(1.07);text-shadow:0 0 14px #ffd43b,0 0 34px #c084fc,0 0 64px #7c3aed}}
.bdg-t{font-size:.8rem;letter-spacing:3px;color:#e9d5ff;animation:fadein .5s .6s both}
.bdg-n{font-size:1.5rem;font-weight:800;animation:fadein .5s .75s both}
.bdg-d{font-size:.95rem;color:#e9d5ff;animation:fadein .5s .9s both}
.bdg-x{font-size:.72rem;opacity:.6;margin-top:6px}
@media (prefers-reduced-motion:reduce){.bdg *{animation:none!important}}

h1{cursor:pointer}
.quote.bate{animation:bate .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bate{0%{transform:scale(1.25) rotate(-1.5deg);opacity:0}60%{transform:scale(.98)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.quote.bate{animation:none}}
.nome-ov{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(10,4,24,.88);padding:20px}
.nome-ov.on{display:flex}
.nome-box{background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:22px;max-width:360px;width:100%;text-align:center;box-shadow:0 0 30px rgba(168,85,247,.5)}
.nome-box h2{margin:0 0 6px}
.nome-box p{margin:0 0 14px;color:var(--mut)}
.nome-box input{width:100%;padding:12px 14px;font-size:1.05rem;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--txt);outline:none;text-align:center}
.nome-box input:focus{border-color:var(--acc)}
.nome-box button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}

.flt{display:flex;gap:6px;margin-top:10px}
.flt button{flex:1;padding:7px 0;border:1px solid var(--bd);background:var(--bg);color:var(--txt);border-radius:8px;font-weight:600;font-size:.8rem;cursor:pointer}
.flt button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.gscroll{max-height:440px;overflow-y:auto;margin-top:10px;padding-right:4px}
.gscroll .grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-top:0}
.gscroll .bd{padding:8px 4px}
.gscroll .bi{font-size:1.5rem}
.gscroll .bn{font-size:.78rem}
.gscroll .bs{font-size:.66rem}
.bdg-d{white-space:pre-line}
.rk-top{display:flex;align-items:center;gap:14px;margin:12px 0}
.rk-em{width:64px;height:64px;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center;font-size:2rem;background:var(--bg);flex:none}
.rk-n{font-family:"Anton",Impact,"Arial Black",sans-serif;font-size:1.6rem;letter-spacing:1px;text-transform:uppercase;line-height:1.1}
.rk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:12px}
.rk{border:1px solid var(--bd);border-radius:10px;padding:8px 4px;text-align:center;font-size:.7rem;background:var(--bg);opacity:.45;filter:grayscale(1)}
.rk.ok,.rk.now{opacity:1;filter:none}
.rk.now{border-width:2px}
.rk span{display:block;font-size:1.4rem}
.rk b{display:block;font-size:.8rem}

.nome-box{max-height:92vh;overflow-y:auto}
.tr-box{max-width:430px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0 4px}
.nome-box .chip{width:auto;margin-top:0;padding:12px 16px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--txt);font-size:1rem;font-weight:700}
.nome-box .chip.on{border-color:var(--acc);background:var(--acc);color:#fff;box-shadow:0 0 14px rgba(168,85,247,.6)}
.nome-box button:disabled{opacity:.4;cursor:not-allowed}
.nome-box .trx{background:none;color:var(--mut);font-weight:400;margin-top:6px;text-decoration:underline}
.top{gap:8px}
.mini{background:none;border:1px solid var(--acc);color:var(--acc);border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer;font-size:.8rem;white-space:nowrap}
#lista{margin-top:6px}
.vazio{padding:18px 8px;text-align:center;color:var(--mut)}
.grp{margin-top:16px}
.grp-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;padding-bottom:6px;border-bottom:2px solid var(--acc)}
.reg{margin-top:10px;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;background:var(--bg)}
.reg.ativa{border-color:var(--acc);box-shadow:0 0 14px rgba(168,85,247,.35)}
.reg.espera{opacity:.6;cursor:pointer}
.reg.feita{border-color:var(--ok)}
.reg-h{font-weight:700;font-size:.92rem}
.reg-h small{font-weight:400;color:var(--mut);margin-left:6px}
.opts{margin-top:6px}
.opt{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--bd);cursor:pointer}
.opt:first-child{border-top:0}
.optx{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;flex:1;min-width:0}
.tag{font-size:.72rem;color:var(--mut);opacity:.85;font-style:italic}
.opt.done .txt{color:var(--mut)}
.opt.done .ch{text-decoration:line-through}
.opt.trava{opacity:.4;cursor:not-allowed}

/* ===== FOTO DE PERFIL ===== */
.avatar{position:relative;width:56px;height:56px;border-radius:50%;border:2px solid #e9d5ff;background:rgba(255,255,255,.16);padding:0;overflow:hidden;cursor:pointer;flex:none;box-shadow:0 0 14px rgba(233,213,255,.45);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .cam{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#a855f7;border:2px solid #4c1d95;font-size:.62rem;display:flex;align-items:center;justify-content:center;line-height:1}
.avatar:active{transform:scale(.95)}
.foto-prev{width:140px;height:140px;border-radius:50%;margin:4px auto 14px;border:3px solid var(--acc);overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:4rem;box-shadow:0 0 22px rgba(168,85,247,.5)}
.foto-prev img{width:100%;height:100%;object-fit:cover;display:block}

/* ===== ANIMAÇÃO AO MONTAR O TREINO (bomba / fogo / raio) ===== */
#pf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:260;display:none}
#treinoov .nome-box{transition:filter .15s}
.nome-box.k-bomba{animation:kBomba .65s linear forwards}
@keyframes kBomba{
 0%{transform:translate(0,0) scale(1);filter:none;box-shadow:0 0 30px rgba(168,85,247,.5)}
 12%{transform:translate(-4px,3px) scale(1.01)}25%{transform:translate(4px,-3px) scale(1.02)}
 37%{transform:translate(-5px,-2px) scale(1.02)}50%{transform:translate(5px,3px) scale(1.03)}
 62%{transform:translate(-6px,2px) scale(1.03)}75%{transform:translate(6px,-3px) scale(1.04)}
 87%{transform:translate(-6px,3px) scale(1.05)}
 100%{transform:translate(0,0) scale(1.05);filter:brightness(1.5) saturate(2.5) hue-rotate(-40deg);box-shadow:0 0 50px rgba(255,80,30,.9)}}
.nome-box.k-fogo{animation:kFogo 1.8s ease-in forwards}
@keyframes kFogo{
 0%{filter:none;box-shadow:0 0 30px rgba(168,85,247,.5);opacity:1;transform:none}
 35%{filter:brightness(.85) sepia(.6) saturate(2) hue-rotate(-25deg);box-shadow:0 8px 50px rgba(255,120,20,.9)}
 70%{filter:brightness(.35) sepia(1) saturate(1.5);box-shadow:0 8px 60px rgba(255,80,10,.9);opacity:1}
 100%{filter:brightness(.05) grayscale(1);box-shadow:none;opacity:0;transform:scale(.94) translateY(16px)}}
.nome-box[data-dano="1"]{filter:brightness(.8) saturate(.7)}
.nome-box[data-dano="2"]{filter:brightness(.55) saturate(.4)}
.nome-box[data-dano="3"]{filter:brightness(.3) saturate(.2) grayscale(.6)}
.nome-box.k-hit{animation:kHit .35s linear}
@keyframes kHit{0%{filter:brightness(4) contrast(1.3);transform:translate(0,0)}
 20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}100%{transform:translate(0,0)}}
.nome-box.k-torrado{animation:kTorrado .5s ease-in forwards}
@keyframes kTorrado{0%{filter:brightness(.3) saturate(.2) grayscale(.6);opacity:1;transform:none}
 100%{filter:brightness(0);opacity:0;transform:scale(.9) translateY(18px)}}
/* ===== TELAS / PASSOS / PERFIL / RESUMO DE XP ===== */
.scr{display:none}
.scr.on{display:block;animation:scrIn .45s cubic-bezier(.2,.9,.3,1) both}
.scr.out{display:block;animation:scrOut .22s ease-in both}
@keyframes scrIn{from{opacity:0;transform:translateX(var(--from,36px)) scale(.98)}to{opacity:1;transform:none}}
@keyframes scrOut{to{opacity:0;transform:translateX(calc(var(--from,36px)*-1)) scale(.98)}}
.reg.ativa{animation:stepIn .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes stepIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.reg.selo{animation:selo .7s ease-out}
@keyframes selo{30%{transform:scale(1.05);border-color:#22c55e;box-shadow:0 0 34px #22c55e}}
.enc{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#c026d3);color:#fff;font-size:1.05rem;font-weight:800;letter-spacing:.5px;cursor:pointer}
.enc:disabled{opacity:.35;cursor:not-allowed}
.enc.pronto{animation:pulsoBtn 1.1s ease-in-out infinite alternate}
@keyframes pulsoBtn{to{transform:scale(1.03);box-shadow:0 0 26px #c084fc}}
.voltar{margin-bottom:12px}
.ph{text-align:center}
.ph-av{width:104px;height:104px;border-radius:50%;margin:0 auto 8px;border:3px solid var(--acc);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:3rem;background:var(--bg);box-shadow:0 0 24px rgba(168,85,247,.55);cursor:pointer}
.ph-av img{width:100%;height:100%;object-fit:cover;display:block}
.ph-nm{font-family:"Anton",Impact,"Arial Black",sans-serif;font-size:1.7rem;letter-spacing:1px;text-transform:uppercase}
.ph .mini{margin:8px 0 4px}
.ph-st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ph-st div{border:1px solid var(--bd);border-radius:12px;padding:10px 4px;background:var(--bg)}
.ph-st b{display:block;font-size:1.4rem;color:var(--acc)}
.ph-st small{color:var(--mut);font-size:.72rem}
.shk{animation:tremer .65s ease-in-out}
.rs-box{text-align:center}
.rs-t{font-family:"Anton",Impact,"Arial Black",sans-serif;font-size:1.5rem;letter-spacing:1px;color:var(--acc)}
.rs-orb{width:92px;height:92px;margin:14px auto 6px;border-radius:50%;border:4px solid var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background:var(--bg);box-shadow:0 0 26px rgba(168,85,247,.6)}
.rs-orb small{font-size:.65rem;letter-spacing:2px;color:var(--mut)}
.rs-orb b{font-size:2.4rem}
.rs-orb.bump{animation:orbBump .8s cubic-bezier(.2,1.8,.4,1)}
@keyframes orbBump{0%{transform:scale(.4);filter:brightness(4)}100%{transform:none;filter:none}}
.rs-tit{font-weight:700;margin-bottom:10px}
.rs-bar{height:16px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0}
.rs-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#e879f9);box-shadow:0 0 12px #c084fc}
.rs-rows{margin:12px 0 4px;text-align:left}
.rs-r{display:flex;justify-content:space-between;gap:8px;padding:8px 2px;border-top:1px solid var(--bd);animation:stepIn .4s both}
.rs-r b{color:var(--ok);white-space:nowrap}
.rs-ganho{font-family:"Anton",Impact,"Arial Black",sans-serif;font-size:2.4rem;color:var(--acc);margin:6px 0 2px;text-shadow:0 0 14px rgba(168,85,247,.6)}
.lvban{position:fixed;inset:0;z-index:210;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#fff;background:radial-gradient(circle,rgba(124,58,237,.55),rgba(10,4,24,.94) 70%);cursor:pointer;animation:fadein .25s both}
.lvban.sai{animation:fadeout .25s both}
@keyframes fadeout{to{opacity:0}}
.lvfr{font-family:"Anton",Impact,"Arial Black",sans-serif;font-size:clamp(1.2rem,6vw,1.9rem);text-transform:uppercase;letter-spacing:1px;line-height:1.2;max-width:420px;text-shadow:0 0 14px #a855f7;animation:fadein .5s .8s both}
.lvx{font-size:.72rem;opacity:.6;animation:fadein .5s 1.6s both}
@media (prefers-reduced-motion:reduce){.scr.on,.scr.out,.reg.ativa,.reg.selo,.enc.pronto,.shk,.rs-r,.lvban *{animation:none!important}}

/* ===== TIERS ESTILO ACADEMIA ===== */
.emb{display:inline-block;vertical-align:middle;filter:drop-shadow(0 0 7px var(--c,#a855f7));overflow:visible}
.emb-i{width:auto;filter:drop-shadow(0 0 3px var(--c))}
.bdg-ico .emb{filter:drop-shadow(0 0 18px var(--c))}
.th{--c:#9aa0a6;--k:#555;position:relative;margin:12px 0;border:2px solid var(--c);border-radius:14px;overflow:hidden;text-align:center;color:#fff;
 background:radial-gradient(120% 70% at 50% 28%,color-mix(in srgb,var(--c) 28%,transparent),transparent 70%),linear-gradient(180deg,#1b1b24,#0b0b10);
 box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 30px rgba(0,0,0,.6)}
.th-rib{font-family:"Anton",Impact,"Arial Black",sans-serif;font-size:1.7rem;letter-spacing:3px;text-transform:uppercase;padding:6px 0 4px;color:#101014;
 background:linear-gradient(180deg,#fff9,transparent 45%),linear-gradient(90deg,var(--k),var(--c) 50%,var(--k));text-shadow:0 1px 0 #fff6}
.th-rib small{font-size:.9rem;letter-spacing:1px;opacity:.75}
.th-emb{padding:16px 0 4px;animation:flutuar 2.4s ease-in-out infinite alternate}
.th-sub{font-weight:800;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:var(--c)}
.th-pips{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}
.th-pips i{width:18px;height:6px;border-radius:3px;background:#2b2b36}
.th-pips i.on{background:linear-gradient(90deg,var(--k),var(--c));box-shadow:0 0 8px var(--c)}
.th-st{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px 0}
.th-st div{background:#00000066;border:1px solid #ffffff1c;border-radius:8px;padding:6px 4px;font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:#aab}
.th-st b{display:block;font-family:"Anton",Impact,sans-serif;font-size:1.3rem;letter-spacing:1px;color:#fff;font-weight:400}
.th-exp{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;font-size:.7rem;font-weight:800;letter-spacing:2px;color:#aab}
.th-exp .bar{flex:1;margin:0;background:#00000099;border:1px solid #ffffff1f;height:10px}
.th-exp .bar i{background:linear-gradient(90deg,var(--k),var(--c));box-shadow:0 0 8px var(--c)}
.th-nx{padding:2px 12px 12px;font-size:.75rem;color:#aab}
.tl{position:relative;display:flex;gap:10px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tc{--c:#9aa0a6;--k:#555;flex:none;width:118px;scroll-snap-align:center;border:2px solid var(--c);border-radius:12px;overflow:hidden;text-align:center;color:#fff;
 background:linear-gradient(180deg,#1b1b24,#0b0b10);padding-bottom:8px}
.tc-h{font-family:"Anton",Impact,sans-serif;letter-spacing:1.5px;text-transform:uppercase;font-size:1rem;padding:4px 0 2px;color:#101014;background:linear-gradient(90deg,var(--k),var(--c) 50%,var(--k))}
.tc-e{padding:10px 0 2px;min-height:78px;display:flex;align-items:center;justify-content:center}
.tc-s{font-size:.62rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--c)}
.tc-d{font-size:.68rem;color:#aab;margin-top:2px}
.tc-t{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:99px;font-size:.58rem;font-weight:800;letter-spacing:1px;border:1px solid #ffffff2a;color:#889}
.tc.ok .tc-t{color:#101014;background:var(--c);border-color:var(--c)}
.tc.now{box-shadow:0 0 18px var(--c);transform:translateY(-2px)}
.tc.now .tc-t{color:#101014;background:#fff;border-color:#fff}
.tc.lk{border-color:#ffffff22;filter:grayscale(1);opacity:.5}
.tc.lk .tc-h{background:#3a3a44;color:#ccd}

body{font-family:"Rajdhani",system-ui,sans-serif;font-size:1.05rem;font-weight:500;
background:radial-gradient(60% 40% at 85% 0%,rgba(168,85,247,.28),transparent 70%),radial-gradient(50% 35% at 0% 100%,rgba(34,211,238,.18),transparent 70%),linear-gradient(rgba(34,211,238,.045) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(34,211,238,.045) 1px,transparent 1px) 0 0/34px 34px,#070b18 fixed}
body::after{content:"";position:fixed;right:-40px;bottom:-30px;width:300px;aspect-ratio:91/80;background:linear-gradient(135deg,var(--neon),var(--neon2));-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;opacity:.05;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
.lg{display:inline-block;aspect-ratio:91/80;background:linear-gradient(135deg,var(--neon),var(--neon2));-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;filter:drop-shadow(0 0 6px rgba(34,211,238,.7));flex:none}
h1,.quote,.rk-n,.ph-nm,.rs-t,.rs-ganho,.lvfr,.top h2,.nome-box h2{font-family:"Orbitron","Rajdhani",sans-serif}
h1#h1{display:flex;align-items:center;gap:12px;margin:6px 0 14px;color:var(--txt);font-size:1.15rem;letter-spacing:2px;text-transform:uppercase}
h1#h1 .lg{width:50px}
h1#h1 .bt{display:flex;flex-direction:column;line-height:1.1;font-weight:800}
h1#h1 .bt b{background:linear-gradient(90deg,var(--neon),var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1#h1 small{font-family:"Rajdhani",sans-serif;font-size:.8rem;font-weight:600;letter-spacing:1.5px;color:var(--mut);margin-top:3px;text-transform:none}
.hud{background:linear-gradient(100deg,#0a1226,#1a0f3d 70%,#0a1226);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--neon),var(--neon2),var(--neon)) 1;box-shadow:0 6px 24px rgba(34,211,238,.18)}
.lv,.avatar{border:2px solid var(--neon);background:rgba(34,211,238,.08);box-shadow:0 0 14px rgba(34,211,238,.55),inset 0 0 10px rgba(34,211,238,.25)}
.lv b,.xpl strong{font-family:"Orbitron",sans-serif}
.xpb{border:1px solid rgba(34,211,238,.35);background:#050816}
.xpb i{background:linear-gradient(90deg,var(--neon),var(--neon2));box-shadow:0 0 12px var(--neon)}
.card{position:relative;background:linear-gradient(180deg,rgba(18,30,60,.75),rgba(10,16,34,.9));border:1px solid rgba(34,211,238,.28);border-radius:6px;box-shadow:0 0 26px rgba(34,211,238,.12),inset 0 0 30px rgba(34,211,238,.04)}
.card::before,.card::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--neon);pointer-events:none}
.card::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.card::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.quote{border-left:4px solid var(--neon2);border-radius:4px;background:linear-gradient(90deg,rgba(168,85,247,.2),rgba(13,20,40,.8));font-style:normal;font-size:.95rem;letter-spacing:.5px;box-shadow:0 0 18px rgba(168,85,247,.25)}
.tab{background:#0d1428;border-radius:6px;font-family:"Orbitron",sans-serif;font-size:.78rem}
.tab.sel{background:linear-gradient(135deg,var(--neon),var(--neon2));border-color:var(--neon);color:#050816;box-shadow:0 0 14px rgba(34,211,238,.6)}
.bar{border:1px solid rgba(34,211,238,.25);background:#050816}
.bar i{background:linear-gradient(90deg,var(--neon),var(--neon2));box-shadow:0 0 10px var(--neon)}
.mini{border-color:var(--neon);color:var(--neon);border-radius:4px;font-family:"Orbitron",sans-serif;font-size:.7rem;letter-spacing:.5px}
.reg,.bd,.rk,.ph-st div{background:rgba(7,11,24,.75);border-radius:6px}
.reg.ativa,.bd.on{border-color:var(--neon);box-shadow:0 0 16px rgba(34,211,238,.35)}
.enc{border-radius:6px;background:linear-gradient(90deg,#0891b2,var(--neon2));font-family:"Orbitron",sans-serif;letter-spacing:1px;text-transform:uppercase;font-size:.9rem}
.enc.pronto{animation:pulsoBtn 1.1s ease-in-out infinite alternate;box-shadow:0 0 18px rgba(34,211,238,.6)}
.nome-ov{background:rgba(3,6,16,.92)}
.nome-box{background:#0b1226;border:1px solid var(--neon);border-radius:8px;box-shadow:0 0 34px rgba(34,211,238,.35)}
.nome-box .lg{width:78px;display:block;margin:0 auto 8px}
.nome-box button{background:linear-gradient(90deg,#0891b2,var(--neon2));font-family:"Orbitron",sans-serif;font-size:.85rem}
.nome-box .chip.on,.flt button.on{background:var(--neon);color:#050816;border-color:var(--neon);box-shadow:0 0 14px rgba(34,211,238,.6)}
.ph-av,.rs-orb,.foto-prev{border-color:var(--neon);box-shadow:0 0 24px rgba(34,211,238,.55)}
.ph-st b,.rs-t,.rs-ganho{color:var(--neon);text-shadow:0 0 14px rgba(34,211,238,.6)}
.rs-bar i{background:linear-gradient(90deg,var(--neon),var(--neon2))}
.brand-foot{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 8px;font-family:"Orbitron",sans-serif;font-size:.8rem;letter-spacing:3px;color:var(--mut)}
.brand-foot .lg{width:34px}
.nome-box .lg+h2{margin-top:0}

/* ===== ABERTURA ANIMADA ===== */
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 42%,#1b0f45 0%,#070b18 62%);cursor:pointer;transition:opacity .55s,transform .55s}
#splash.sai{opacity:0;transform:scale(1.08);pointer-events:none}
.sp-grid{position:absolute;inset:0;background:linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px) 0 0/34px 34px;-webkit-mask:radial-gradient(circle at 50% 42%,#000,transparent 70%);mask:radial-gradient(circle at 50% 42%,#000,transparent 70%);animation:spIn .8s both}
.sp-core{position:relative;width:min(62vw,260px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.sp-ring{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:spRing .9s .1s cubic-bezier(.2,1.2,.4,1) forwards}
.sp-ring.r1{animation-name:spRing,spin;animation-duration:.9s,9s;animation-delay:.1s,.1s;animation-iteration-count:1,infinite;animation-timing-function:cubic-bezier(.2,1.2,.4,1),linear}
.sp-ring.r2{inset:9%;width:82%;height:82%;animation-name:spRing,spinR;animation-duration:.9s,7s;animation-delay:.3s,.3s;animation-iteration-count:1,infinite;animation-timing-function:cubic-bezier(.2,1.2,.4,1),linear}
.sp-ring.r3{inset:19%;width:62%;height:62%;animation-delay:.5s}
@keyframes spRing{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
.sp-logowrap{position:relative;width:46%;aspect-ratio:91/80}
.sp-logo{width:100%;height:100%;display:block;filter:drop-shadow(0 0 12px rgba(34,211,238,.9)) drop-shadow(0 0 28px rgba(168,85,247,.7));clip-path:inset(100% 0 0 0);animation:spReveal 1.1s .55s cubic-bezier(.65,0,.25,1) forwards,spGlitch .5s 1.9s steps(2) 1,spPulse 1.4s 2.1s ease-in-out infinite alternate}
.sp-scan{position:absolute;left:-14%;right:-14%;height:3px;top:100%;background:linear-gradient(90deg,transparent,var(--neon),#fff,var(--neon2),transparent);box-shadow:0 0 14px var(--neon);opacity:0;animation:spScan 1.1s .55s cubic-bezier(.65,0,.25,1) forwards}
@keyframes spReveal{to{clip-path:inset(0 0 0 0)}}
@keyframes spScan{0%{top:100%;opacity:1}95%{opacity:1}100%{top:-4%;opacity:0}}
@keyframes spGlitch{0%{transform:translate(-4px,1px);filter:drop-shadow(3px 0 #f0f) drop-shadow(-3px 0 #0ff)}50%{transform:translate(4px,-1px)}100%{transform:none}}
@keyframes spPulse{to{filter:drop-shadow(0 0 20px rgba(34,211,238,1)) drop-shadow(0 0 40px rgba(168,85,247,.9))}}
.sp-name{font-family:"Orbitron",sans-serif;font-weight:900;font-size:clamp(1.3rem,6.5vw,1.9rem);color:#fff;text-transform:uppercase;white-space:nowrap;animation:spName 1s 1.1s cubic-bezier(.2,.8,.2,1) both}
.sp-name b{background:linear-gradient(90deg,var(--neon),var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes spName{from{opacity:0;letter-spacing:.7em;filter:blur(6px)}to{opacity:1;letter-spacing:.16em;filter:none}}
.sp-bar{width:min(58vw,230px);height:4px;background:rgba(34,211,238,.15);border-radius:99px;overflow:hidden;animation:spIn .4s 1.3s both}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--neon2));box-shadow:0 0 10px var(--neon);animation:spBar 1.4s 1.4s ease-out forwards}
@keyframes spBar{to{width:100%}}
.sp-st{font-family:"Rajdhani",sans-serif;font-weight:600;font-size:.85rem;letter-spacing:4px;color:var(--mut);text-transform:uppercase;animation:spIn .4s 1.3s both}
@keyframes spIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *,#splash{animation:none!important}.sp-logo{clip-path:none}.sp-ring,.sp-name,.sp-bar,.sp-st{opacity:1}.sp-bar i{width:100%}}
</style>
</head>

<script>
// ====== BANCO DE TREINOS (edite aqui) ======
// Cada região: [id, nome, "treino para ...", [exercícios que o usuário pode escolher]]
const GRUPOS=[
 {id:"peito",nome:"Peito",ico:"🦍",regioes:[
  ["meio","Meio do peito","o meio do peito",["Supino reto com barra","Supino reto com halteres","Supino na máquina","Flexão de braço"]],
  ["sup","Parte superior","a parte superior do peito",["Supino inclinado com barra","Supino inclinado com halteres","Crucifixo inclinado","Flexão com pés elevados"]],
  ["inf","Parte inferior","a parte inferior do peito",["Supino declinado","Crucifixo declinado","Mergulho nas paralelas","Crossover na polia alta"]],
  ["int","Parte interna","a parte interna do peito (definição)",["Crucifixo (voador)","Crossover na polia","Peck deck","Supino pegada fechada"]]]},
 {id:"costas",nome:"Costas",ico:"🦅",regioes:[
  ["larg","Largura (dorsais)","a largura das costas (dorsais)",["Puxada frontal","Puxada triângulo","Barra fixa","Pulldown com corda"]],
  ["esp","Espessura","a espessura do meio das costas",["Remada curvada","Remada baixa","Remada cavalinho","Remada unilateral (serrote)"]],
  ["lomb","Lombar","a lombar",["Hiperextensão","Levantamento terra romeno","Good morning","Extensão lombar na máquina"]]]},
 {id:"ombro",nome:"Ombro",ico:"🏔️",regioes:[
  ["ant","Ombro frontal","a parte frontal do ombro",["Desenvolvimento com halteres","Desenvolvimento militar","Elevação frontal","Desenvolvimento Arnold"]],
  ["lat","Ombro lateral","a lateral do ombro",["Elevação lateral","Elevação lateral na polia","Elevação lateral na máquina","Remada alta"]],
  ["post","Ombro posterior","a parte posterior do ombro",["Crucifixo inverso","Face pull","Peck deck invertido","Elevação posterior com halteres"]],
  ["trap","Trapézio","o trapézio",["Encolhimento com halteres","Encolhimento com barra","Encolhimento no smith","Caminhada do fazendeiro"]]]},
 {id:"braco",nome:"Braço",ico:"💪",regioes:[
  ["bic","Bíceps","o bíceps",["Rosca direta","Rosca alternada","Rosca martelo","Rosca Scott"]],
  ["tri","Tríceps","o tríceps",["Tríceps corda","Tríceps testa","Tríceps francês","Mergulho no banco"]],
  ["ant","Antebraço","o antebraço",["Rosca de punho","Rosca de punho inversa","Rosca inversa","Pendurar na barra (isometria)"]]]},
 {id:"perna",nome:"Perna",ico:"🦵",regioes:[
  ["quad","Quadríceps","o quadríceps (frente da coxa)",["Agachamento livre","Leg press 45°","Cadeira extensora","Agachamento hack"]],
  ["post","Posterior de coxa","o posterior de coxa",["Mesa flexora","Stiff com barra","Cadeira flexora","Flexão nórdica"]],
  ["glut","Glúteos","os glúteos",["Elevação pélvica","Agachamento sumô","Cadeira abdutora","Avanço (afundo)"]],
  ["pant","Panturrilha","a panturrilha",["Panturrilha em pé","Panturrilha sentado","Panturrilha no leg press","Panturrilha no smith"]]]},
 {id:"abdomen",nome:"Abdômen",ico:"🎯",regioes:[
  ["sup","Abdômen superior","o abdômen superior",["Abdominal crunch","Abdominal na máquina","Abdominal na polia","Crunch declinado"]],
  ["inf","Abdômen inferior","o abdômen inferior",["Elevação de pernas","Elevação de joelhos na barra","Abdominal infra no banco","Tesoura"]],
  ["obl","Oblíquos e core","os oblíquos e o core",["Prancha frontal","Prancha lateral","Abdominal oblíquo","Russian twist"]]]},
 {id:"cardio",nome:"Cardio",ico:"🏃",regioes:[
  ["cond","Condicionamento","o condicionamento cardiovascular",["Spinning 30 min","Corrida leve 30 min","Esteira inclinada 20 min","HIIT 15 min"]]]}
];
const FRASES = [
  "Disciplina vence motivação quando a motivação some.",
  "Um treino de cada vez. Hoje é o que importa.",
  "Você não precisa ser perfeito, só precisa aparecer.",
  "O corpo alcança o que a mente acredita.",
  "Dor passa, desistir fica na cabeça.",
  "Pequenos progressos diários viram grandes resultados.",
  "Quem treina quando não tá a fim é quem evolui.",
  "Seu eu do futuro vai agradecer por esse treino.",
  "Cansado? Descansa. Desistir? Nunca.",
  "Consistência é o maior segredo do shape.",
  "Cada repetição te aproxima da sua melhor versão.",
  "Não pare quando estiver cansado, pare quando terminar.",
  "O treino mais difícil é o que você não fez.",
  "Foco, força e fé. O resto vem.",
  "Hoje você compete só contra quem foi ontem."
];
// ===================================

const hoje=new Date();
const $=id=>document.getElementById(id);
function chave(d){return "treino:"+d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function pkey(d){return "treino:p:"+d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function ler(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return []}}
function lerP(k){try{return JSON.parse(localStorage.getItem(k))||null}catch(e){return null}}
function gravar(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function fraseDe(d){
  const n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
  return FRASES[n%FRASES.length];
}

// ===== PLANO DE HOJE: grupos escolhidos + 1 exercício feito por região =====
let PLANO={g:[],f:{}}, foco=null;
const grupo=id=>GRUPOS.find(g=>g.id===id);
function carregaPlano(){
  const p=lerP(pkey(hoje));
  PLANO={g:(p&&Array.isArray(p.g))?p.g.filter(grupo):[],f:(p&&p.f&&typeof p.f==="object")?p.f:{}};
}
function salvaPlano(){gravar(pkey(hoje),PLANO)}
function regioesDoDia(){
  const out=[];
  PLANO.g.forEach(gid=>grupo(gid).regioes.forEach(r=>out.push({gid:gid,key:gid+"."+r[0],nome:r[1],t:r[2],ex:r[3]})));
  return out;
}

// ----- popup "o que vai treinar hoje?" (aparece toda vez que abre o site)
let selTmp=[];
function abreEscolha(){
  selTmp=PLANO.g.slice();
  $("trtit").textContent=(NOME?"E aí, "+NOME+"! ":"")+"O que vai treinar hoje?";
  $("trfecha").style.display=PLANO.g.length?"block":"none";
  pintaChips();
  $("treinoov").classList.add("on");
}
function pintaChips(){
  const box=$("trchips"); box.innerHTML="";
  GRUPOS.forEach(g=>{
    const trava=PLANO.g.includes(g.id)&&g.regioes.some(r=>PLANO.f[g.id+"."+r[0]]);
    const b=document.createElement("button");
    b.className="chip"+(selTmp.includes(g.id)?" on":"");
    b.textContent=g.ico+" "+g.nome+(trava?" 🔒":"");
    b.onclick=()=>{
      if(trava) return;
      selTmp=selTmp.includes(g.id)?selTmp.filter(x=>x!==g.id):selTmp.concat(g.id);
      pintaChips();
    };
    box.appendChild(b);
  });
  $("trbtn").disabled=!selTmp.length;
  $("trbtn").textContent=PLANO.g.length?"Atualizar treino ⚡":"Montar meu treino ⚡";
}
// ===== ANIMAÇÃO AO MONTAR O TREINO: bomba, fogo ou raio (sorteio aleatório) =====
const pfc=$("pf"), pg=pfc.getContext("2d");
let animando=false, pfId=0, PS=[];
const FOGO=["255,220,80","255,160,40","255,90,20","230,50,20"];
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function addP(o){PS.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,life:800,age:0,s:4,s2:0,cor:"255,160,40",a:1,tipo:"c",rot:0,vr:0,add:true},o))}
function stepP(dt){
  for(let i=PS.length-1;i>=0;i--){
    const p=PS[i]; p.age+=dt;
    if(p.age>=p.life){PS.splice(i,1);continue}
    const k=dt/16.7;
    p.vy+=p.g*k; p.x+=p.vx*k; p.y+=p.vy*k; p.rot+=p.vr*k;
    const t=p.age/p.life, sz=p.s+(p.s2-p.s)*t, al=p.a*(1-t);
    pg.globalCompositeOperation=p.add?"lighter":"source-over";
    pg.fillStyle="rgba("+p.cor+","+al.toFixed(3)+")";
    if(p.tipo==="q"){pg.save();pg.translate(p.x,p.y);pg.rotate(p.rot);pg.fillRect(-sz/2,-sz/2,sz,sz);pg.restore()}
    else{pg.beginPath();pg.arc(p.x,p.y,Math.max(.1,sz),0,6.2832);pg.fill()}
  }
  pg.globalCompositeOperation="source-over";
}
function boltPts(x0,y0,x1,y1){
  const pts=[[x0,y0]], n=10;
  for(let i=1;i<n;i++){const t=i/n; pts.push([x0+(x1-x0)*t+rnd(-35,35), y0+(y1-y0)*t+rnd(-12,12)])}
  pts.push([x1,y1]); return pts;
}
function drawBolt(pts,w){
  pg.lineJoin="round"; pg.lineCap="round";
  [["rgba(168,85,247,.35)",w*5],["rgba(196,150,255,.8)",w*2.2],["#fff",w]].forEach(c=>{
    pg.strokeStyle=c[0]; pg.lineWidth=c[1]; pg.shadowColor="#c084fc"; pg.shadowBlur=18;
    pg.beginPath(); pts.forEach((q,i)=>i?pg.lineTo(q[0],q[1]):pg.moveTo(q[0],q[1])); pg.stroke();
  });
  pg.shadowBlur=0;
}
function rodaAnim(tipo,box,ov,fim){
  const r=box.getBoundingClientRect(), cxm=r.left+r.width/2, cym=r.top+r.height/2;
  pfc.width=innerWidth; pfc.height=innerHeight; pfc.style.display="block"; PS=[];
  const DUR={bomba:1700,fogo:1900,raio:1950}[tipo];
  let flash=0, ringT=null, explodiu=false, disparados=0, torrou=false, strikes=[];
  box.classList.add("k-"+tipo);
  const T0=performance.now(); let ult=T0;

  function animBomba(t){
    if(t<650){
      const sz=70+(t/650)*50+Math.sin(t/45)*6;
      pg.font=sz+"px serif"; pg.textAlign="center"; pg.textBaseline="middle";
      pg.fillText("💣",cxm,cym);
      addP({x:cxm+sz*.28,y:cym-sz*.42,vx:rnd(-1.5,1.5),vy:rnd(-3,-.5),g:.08,life:350,s:rnd(2,4),cor:"255,200,60"});
    }else if(!explodiu){
      explodiu=true; flash=.95; ringT=t; box.style.visibility="hidden";
      const m=document.querySelector("main"); m.classList.remove("tremer"); void m.offsetWidth; m.classList.add("tremer");
      setTimeout(()=>m.classList.remove("tremer"),600);
      try{navigator.vibrate&&navigator.vibrate([120,40,80])}catch(e){}
      for(let i=0;i<80;i++){const a=rnd(0,6.2832), v=rnd(2,9);
        addP({x:cxm+rnd(-20,20),y:cym+rnd(-20,20),vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.05,life:rnd(400,900),s:rnd(8,20),s2:0,cor:pick(FOGO)});}
      for(let i=0;i<45;i++){const a=rnd(0,6.2832), v=rnd(3,12);
        addP({x:rnd(r.left,r.right),y:rnd(r.top,r.bottom),vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.4,life:rnd(900,1400),s:rnd(6,16),s2:rnd(4,10),cor:pick(["88,40,160","168,85,247","40,20,80"]),add:false,tipo:"q",vr:rnd(-.3,.3)});}
      for(let i=0;i<28;i++){
        addP({x:cxm+rnd(-60,60),y:cym+rnd(-40,40),vx:rnd(-1.5,1.5),vy:rnd(-2,-.3),life:rnd(1000,1400),s:rnd(18,30),s2:rnd(50,70),cor:"60,50,70",a:.5,add:false});}
    }
    if(ringT!==null){
      const rt=t-ringT, al=Math.max(0,1-rt/600);
      if(al>0){pg.strokeStyle="rgba(255,200,120,"+al+")"; pg.lineWidth=14*al+2; pg.beginPath(); pg.arc(cxm,cym,rt*1.1,0,6.2832); pg.stroke();}
    }
  }
  function animFogo(t,dt){
    const prog=Math.min(1,t/1500), n=Math.round(dt/16.7*(prog<1?9:3));
    for(let i=0;i<n;i++){
      const alt=rnd(0,Math.max(.12,prog))*r.height, x=rnd(r.left,r.right);
      addP({x:x,y:r.bottom-alt,vx:rnd(-.6,.6),vy:rnd(-3.2,-1),g:-.03,life:rnd(450,900),s:rnd(10,22),s2:0,cor:pick(FOGO),a:.9});
      if(Math.random()<.3) addP({x:x,y:r.bottom-alt,vx:rnd(-1,1),vy:rnd(-5,-2),life:rnd(800,1400),s:rnd(1.5,3),s2:1,cor:"255,200,90"});
      if(t>900&&Math.random()<.25) addP({x:x,y:r.bottom-alt-10,vx:rnd(-.5,.5),vy:rnd(-2,-.6),life:rnd(900,1400),s:rnd(14,22),s2:rnd(40,60),cor:"50,40,55",a:.4,add:false});
    }
  }
  function animRaio(t){
    const ts=[150,650,1150];
    while(disparados<3&&t>=ts[disparados]){
      const tx=cxm+rnd(-r.width*.25,r.width*.25), ty=cym+rnd(-r.height*.2,r.height*.2);
      const pts=boltPts(tx+rnd(-60,60),0,tx,ty), ramos=[];
      for(let k=0;k<3;k++){const b=pts[2+Math.floor(Math.random()*6)]; ramos.push(boltPts(b[0],b[1],b[0]+rnd(-120,120),b[1]+rnd(60,160)).slice(0,6));}
      strikes.push({t0:t,pts:pts,ramos:ramos});
      flash=.7; disparados++; box.dataset.dano=disparados;
      box.classList.remove("k-hit"); void box.offsetWidth; box.classList.add("k-hit");
      for(let i=0;i<30;i++){const a=rnd(0,6.2832), v=rnd(2,8);
        addP({x:tx,y:ty,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.2,life:rnd(300,700),s:rnd(1.5,3.5),s2:0,cor:"200,160,255"});}
      try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
    }
    strikes.forEach(st=>{const a=1-(t-st.t0)/220; if(a>0){pg.globalAlpha=a; drawBolt(st.pts,3); st.ramos.forEach(rm=>drawBolt(rm,1.5)); pg.globalAlpha=1}});
    if(t>1450){
      if(!torrou){torrou=true; box.classList.remove("k-hit"); box.classList.add("k-torrado");
        for(let i=0;i<50;i++) addP({x:rnd(r.left,r.right),y:rnd(r.top,r.bottom),vx:rnd(-1,1),vy:rnd(-3,-.5),g:.02,life:rnd(900,1400),s:rnd(3,8),s2:rnd(1,3),cor:"110,100,120",add:false,tipo:"q",vr:rnd(-.2,.2)});}
      if(Math.random()<.5) addP({x:rnd(r.left,r.right),y:rnd(cym-20,r.bottom),vx:rnd(-.5,.5),vy:rnd(-2,-.6),life:rnd(900,1300),s:rnd(14,22),s2:rnd(40,60),cor:"45,40,50",a:.45,add:false});
    }
  }
  function quadro(now){
    const dt=Math.min(40,now-ult); ult=now; const t=now-T0;
    pg.clearRect(0,0,pfc.width,pfc.height);
    if(tipo==="bomba") animBomba(t); else if(tipo==="fogo") animFogo(t,dt); else animRaio(t);
    stepP(dt);
    if(flash>0){pg.fillStyle="rgba(255,255,255,"+Math.min(.85,flash)+")"; pg.fillRect(0,0,pfc.width,pfc.height); flash-=dt/260;}
    if(t>DUR-350) ov.style.opacity=Math.max(0,(DUR-t)/350);
    if(t<DUR) pfId=requestAnimationFrame(quadro); else fim();
  }
  pfId=requestAnimationFrame(quadro);
}
$("trbtn").onclick=()=>{
  if(!selTmp.length||animando) return;
  PLANO.g=selTmp.slice(); salvaPlano(); foco=null;
  const ov=$("treinoov"), box=ov.querySelector(".nome-box");
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){ov.classList.remove("on"); render(); return;}
  animando=true;
  rodaAnim(pick(["bomba","fogo","raio"]),box,ov,()=>{
    cancelAnimationFrame(pfId); PS=[];
    pg.clearRect(0,0,pfc.width,pfc.height); pfc.style.display="none";
    ov.classList.remove("on"); ov.style.opacity="";
    box.className="nome-box tr-box"; box.removeAttribute("data-dano"); box.style.visibility="";
    animando=false; render();
  });
};
$("trfecha").onclick=()=>$("treinoov").classList.remove("on");
$("trocar").onclick=abreEscolha;

function pintaFrase(){
  const q=$("quote");
  q.textContent="“"+fraseDe(hoje)+"”";
  q.classList.remove("bate"); void q.offsetWidth; q.classList.add("bate");
}

function linha(r,ex,marcado,travado){
  const row=document.createElement("label");
  row.className="opt"+(marcado?" done":"")+(travado?" trava":"");
  const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=marcado; cb.disabled=travado;
  const box=document.createElement("span"); box.className="optx";
  const sp=document.createElement("span"); letras(sp,ex);
  const tag=document.createElement("small"); tag.className="tag"; tag.textContent="treino para "+r.t;
  box.append(sp,tag);
  cb.onchange=()=>marcar(r,ex,cb.checked,sp,row);
  row.append(cb,box);
  return row;
}

function render(){
  $("titulo").textContent=PLANO.g.length?"Treino de hoje":"Treino de hoje";
  $("data").textContent=hoje.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
  const L=$("lista"); L.innerHTML="";
  const regs=regioesDoDia();
  if(!regs.length){
    L.innerHTML='<div class="vazio">Escolha o que vai treinar hoje pra montar o seu treino. 💪</div>';
    atualizar(); return;
  }
  const pend=regs.filter(r=>!PLANO.f[r.key]);
  const ativo=(foco&&pend.find(r=>r.key===foco))||pend[0]||null;
  PLANO.g.forEach(gid=>{
    const g=grupo(gid), sec=document.createElement("div"); sec.className="grp";
    sec.innerHTML='<div class="grp-h"><span></span><b class="grp-c"></b></div>';

// ===== EFEITO: tremor + raios roxos =====
const cv=$("fx"), cx=cv.getContext("2d");
function ajusta(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener("resize",ajusta); ajusta();
let fxId=0;
function raio(x){
  const pts=[[x,0]], alvo=cv.height*(0.5+Math.random()*0.5);
  let y=0, px=x;
  while(y<alvo){y+=18+Math.random()*38; px+=(Math.random()-.5)*80; pts.push([px,y]);}
  return pts;
}
function efeito(){
  const m=document.querySelector("main");
  m.classList.remove("tremer"); void m.offsetWidth; m.classList.add("tremer");
  setTimeout(()=>m.classList.remove("tremer"),600);
  try{navigator.vibrate&&navigator.vibrate(180)}catch(e){}
  const raios=[], n=5+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const r=raio(Math.random()*cv.width);
    const b=r[Math.floor(r.length/2)], ramo=[b];
    let bx=b[0], by=b[1];
    for(let j=0;j<5;j++){by+=15+Math.random()*25; bx+=(Math.random()<.5?-1:1)*(10+Math.random()*30); ramo.push([bx,by]);}
    raios.push(r,ramo);
  }
  cancelAnimationFrame(fxId);
  const t0=performance.now();
  (function quadro(now){
    const p=(now-t0)/800;
    cx.clearRect(0,0,cv.width,cv.height);
    if(p>=1) return;
    const a=(1-p)*(Math.random()>.25?1:.35);
    cx.fillStyle="rgba(168,85,247,"+(0.28*a)+")";
    cx.fillRect(0,0,cv.width,cv.height);
    cx.shadowColor="#a855f7"; cx.shadowBlur=28; cx.lineJoin="round";
    raios.forEach((r,i)=>{
      cx.beginPath();
      r.forEach((pt,k)=>k?cx.lineTo(pt[0],pt[1]):cx.moveTo(pt[0],pt[1]));
      cx.strokeStyle="rgba(233,213,255,"+a+")";
      cx.lineWidth=i%2?1.5:3.5;
      cx.stroke();
    });
    fxId=requestAnimationFrame(quadro);
  })(t0);
}

function stats(){
  let ex=0; const ativos=new Set();
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i)||"";
      if(/^treino:\d+-\d+-\d+$/.test(k)){const n=ler(k).length; if(n>0){ex+=n; ativos.add(k);}}
      else if(/^treino:p:\d+-\d+-\d+$/.test(k)){const pl=lerP(k), n=Object.keys((pl&&pl.f)||{}).length; if(n>0){ex+=n; ativos.add(k.replace("treino:p:","treino:"));}}
    }
  }catch(e){}
  const dnum=k=>{const m=k.split(":")[1].split("-"); return Date.UTC(+m[0],+m[1]-1,+m[2])/864e5;};
  const nums=Array.from(new Set(ler("treino:bonus").map(dnum))).sort((a,b)=>a-b);
  const set=new Set(nums);
  const h=Date.UTC(hoje.getFullYear(),hoje.getMonth(),hoje.getDate())/864e5;
  let atual=0, d=set.has(h)?h:h-1;
  while(set.has(d)){atual++; d--;}
  let melhor=0, run=0, prev=null;
  nums.forEach(n=>{run=(prev!==null&&n===prev+1)?run+1:1; prev=n; if(run>melhor) melhor=run;});
  melhor=Math.max(melhor,atual);
  const tipos={}, sems={};
  nums.forEach(n=>{
    const wd=new Date(n*864e5).getUTCDay();
    const ini=n-((wd+6)%7); sems[ini]=(sems[ini]||0)+1;
  });
  Array.from(new Set(ler("treino:bonus"))).forEach(bk=>{
    const pl=lerP(bk.replace("treino:","treino:p:"));
    ((pl&&pl.g)||[]).forEach(g=>{tipos[g]=(tipos[g]||0)+1;});
  });
  return {ex:ex,ativos:ativos.size,comp:nums.length,atual:atual,melhor:melhor,tipos:tipos,
    semanas:Object.values(sems).filter(c=>c>=7).length,xp:xpTotal(),nivel:nivelDe(xpTotal()).n,rank:rankDe(melhor).i};
}

const fila=[]; let mostrando=false, festaId=0;
function enfileira(item,atraso,prio){

function diaItem(){

  const g=ler("treino:badges");

function proxima(){

  el.querySelector(".bdg-ico").textContent=ico; if(it.t==="rank") el.querySelector(".bdg-ico").innerHTML=emblema(it.i,130);

}
function festa(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const c=$("cf"), g=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cores=["#a855f7","#c084fc","#e9d5ff","#7c3aed","#ffd43b","#f06595","#ffffff"];
  const ps=[], x0=c.width/2, y0=c.height*0.4;
  for(let i=0;i<110;i++){const a=Math.random()*Math.PI*2, v=4+Math.random()*12;
    ps.push({x:x0,y:y0,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.22,r:3+Math.random()*5,cor:cores[i%cores.length],vida:60+Math.random()*50,t:0,tipo:0});}
  for(let i=0;i<90;i++){
    ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*4,g:.05,r:5+Math.random()*6,cor:cores[Math.floor(Math.random()*cores.length)],vida:140+Math.random()*60,t:0,tipo:1,rot:Math.random()*6,vr:(Math.random()-.5)*.3});}
  cancelAnimationFrame(festaId);
  (function q(){
    g.clearRect(0,0,c.width,c.height);
    let vivo=false;
    ps.forEach(p=>{
      if(p.t>=p.vida) return;
      vivo=true; p.t++;
      if(!p.tipo) p.vx*=.985;
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy;
      g.globalAlpha=Math.min(1,(p.vida-p.t)/30);
      g.fillStyle=p.cor;
      if(p.tipo){p.rot+=p.vr; g.save(); g.translate(p.x,p.y); g.rotate(p.rot); g.fillRect(-p.r,-p.r/2,p.r*2,p.r); g.restore();}
      else{g.shadowColor=p.cor; g.shadowBlur=12; g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill(); g.shadowBlur=0;}
    });
    g.globalAlpha=1;
    if(vivo) festaId=requestAnimationFrame(q); else g.clearRect(0,0,c.width,c.height);
  })();
}

// raio cai sobre o nível + tela treme + explosão
function impacto(alvo,aoExplodir){
  return new Promise(res=>{
    const box=$("rsbox"), m=document.querySelector("main");
    if(matchMedia("(prefers-reduced-motion:reduce)").matches){aoExplodir(); res(); return;}
    const r=alvo.getBoundingClientRect(), tx=r.left+r.width/2, ty=r.top+r.height/2;
    pfc.width=innerWidth; pfc.height=innerHeight; pfc.style.display="block"; PS=[];
    const pts=boltPts(tx+rnd(-30,30),0,tx,ty);
    const ramos=[0,1,2,3].map(()=>{const b=pts[2+Math.floor(Math.random()*6)]; return boltPts(b[0],b[1],b[0]+rnd(-150,150),b[1]+rnd(60,170)).slice(0,6);});
    let flash=.9, boom=false; const T0=performance.now(); let ult=T0;
    function q(now){
      const dt=Math.max(0,Math.min(40,now-ult)); ult=now; const t=Math.max(0,now-T0);
      pg.clearRect(0,0,pfc.width,pfc.height);
      if(t<300){pg.globalAlpha=.6+Math.random()*.4; drawBolt(pts,4); ramos.forEach(rm=>drawBolt(rm,2)); pg.globalAlpha=1;}
      if(t>=180&&!boom){
        boom=true; flash=1; aoExplodir();
        [box,m].forEach(e=>{e.classList.remove("shk"); void e.offsetWidth; e.classList.add("shk"); setTimeout(()=>e.classList.remove("shk"),700);});
        try{navigator.vibrate&&navigator.vibrate([200,50,120])}catch(e){}
        for(let i=0;i<110;i++){const a=rnd(0,6.2832), v=rnd(3,13); addP({x:tx,y:ty,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.08,life:rnd(500,1100),s:rnd(6,16),s2:0,cor:pick(FOGO)});}
        for(let i=0;i<60;i++){const a=rnd(0,6.2832), v=rnd(4,15); addP({x:tx,y:ty,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.25,life:rnd(700,1300),s:rnd(1.5,3.5),s2:1,cor:"233,213,255"});}
      }

      if(t<1400) requestAnimationFrame(q); else {pg.clearRect(0,0,pfc.width,pfc.height); pfc.style.display="none"; PS=[]; res();}
    }
    requestAnimationFrame(q);
  });
}

async function abreResumo(antes,depois,i){
  encerrando=true;
  const A=nivelDe(antes), B=nivelDe(depois), rows=$("rsrows"), g=$("rsganho");

  $("rslv").textContent=A.n; $("rstit").textContent=(NOME?NOME+" · ":"")+tituloDe(A.n);

  const linhas=[[i.n+" exercício"+(i.n>1?"s":"")+" × "+XP_EX,i.n*XP_EX]];
  if(i.comp) linhas.push(["🔥 Bônus de treino completo",XP_BONUS]);
  if(i.pago) linhas.push(["Já contabilizado antes",-i.pago]);

    const d=document.createElement("div"); d.className="rs-r"; d.innerHTML="<span></span><b></b>";
    d.firstChild.textContent=l[0]; d.lastChild.textContent=(l[1]>0?"+":"")+l[1]+" XP";
    rows.appendChild(d); await sleep(600);
  }
  if(i.delta>0){
    contar(g,i.delta,1600);
    let res=A.res, n=A.n, resto=i.delta;

      const add=Math.min(resto,A.need-res);

    g.textContent=(i.delta<0?"":"+")+i.delta+" XP"; await sleep(400);
    setBar(B.res/B.need*100); $("rslv").textContent=B.n; $("rstit").textContent=(NOME?NOME+" · ":"")+tituloDe(B.n);

}
